name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    # mariadb comme en local, mysql comme la base déployée sur aiven
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mariadb:11.4
            client: mariadb
            sante: healthcheck.sh --connect --innodb_initialized
            url: jdbc:mariadb://localhost:3306/downlyzer
            dialecte: org.hibernate.dialect.MariaDBDialect
          - image: mysql:8.4
            client: mysql
            sante: mysqladmin ping -h 127.0.0.1 -proot
            url: jdbc:mariadb://localhost:3306/downlyzer?sslMode=trust
            dialecte: org.hibernate.dialect.MySQLDialect

    name: tests (${{ matrix.image }})

    # une vraie base pour DownlyzerApplicationTests, jetée à la fin du job
    services:
      base:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.sante }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # base qui existe que le temps du job, ces mots de passe protègent rien
    env:
      DB_URL: ${{ matrix.url }}
      DB_DIALECT: ${{ matrix.dialecte }}
      DB_USERNAME: downlyzer_app
      DB_PASSWORD: ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # le script et le compte sont les mêmes qu'en local, lancés avec le client du conteneur
      - name: Création de la base
        run: |
          docker exec -i ${{ job.services.base.id }} ${{ matrix.client }} -u root -proot --default-character-set=utf8mb4 < db/create.sql
          docker exec -i ${{ job.services.base.id }} ${{ matrix.client }} -u root -proot -e "CREATE USER 'downlyzer_app'@'%' IDENTIFIED BY 'ci'; GRANT SELECT, INSERT, UPDATE, DELETE ON downlyzer.* TO 'downlyzer_app'@'%';"

      - name: Tests
        run: ./mvnw -B verify
