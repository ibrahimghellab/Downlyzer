spring.application.name=Downlyzer

# Identifiants fournis par variables d'environnement : aucun secret n'est versionné (§7.7)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/downlyzer}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Le schéma est créé par db/create.sql : Hibernate vérifie que les entités y correspondent, sans jamais le modifier
spring.jpa.hibernate.ddl-auto=validate