spring.application.name=Downlyzer

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/downlyzer}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# le schéma vient de db/create.sql, hibernate vérifie juste que les entités correspondent
spring.jpa.hibernate.ddl-auto=validate

# clé de l'api, jamais dans le code ; sans elle l'api refuse tout
downlyzer.api.cle=${DOWNLYZER_API_KEY:}

# swagger documente seulement l'api, pas les pages
springdoc.paths-to-match=/api/**
