spring.application.name=Downlyzer

# port donné par l'hébergeur, 8080 en local
server.port=${PORT:8080}
# derrière le proxy https de l'hébergeur, pour que les adresses générées (Location) soient en https
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/downlyzer}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# hibernate écrit l'url de connexion au démarrage, et le pilote mariadb y met le mot de passe
logging.level.org.hibernate.orm.connections.pooling=WARN

# le schéma vient de db/create.sql, hibernate vérifie juste que les entités correspondent
spring.jpa.hibernate.ddl-auto=validate

# clé de l'api, jamais dans le code ; sans elle l'api refuse tout
downlyzer.api.cle=${DOWNLYZER_API_KEY:}

springdoc.paths-to-match=/api/**
