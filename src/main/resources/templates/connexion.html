<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Downlyzer</title>
    <th:block th:replace="~{fragments/entete :: styles}"></th:block>
</head>
<body>
<main class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card w-100 carte-connexion">
        <div class="card-body p-4">
            <div class="marque mb-3">
                <svg th:replace="~{fragments/entete :: symbole}"></svg>
                Downlyzer
            </div>
            <h1 class="h5 mb-1">Connexion</h1>
            <p class="text-body-secondary small mb-4">Supervision des équipements et suivi des incidents du réseau</p>

            <!-- spring security renvoie ici avec ?error si la connexion échoue -->
            <div class="alert alert-danger" role="alert" th:if="${param.error}">
                Identifiant ou mot de passe incorrect.
            </div>

            <!-- et avec ?logout après la déconnexion -->
            <div class="alert alert-info" role="status" th:if="${param.logout}">
                Vous êtes déconnecté.
            </div>

            <!-- th:action ajoute le jeton csrf -->
            <form method="post" th:action="@{/connexion}">
                <div class="mb-3">
                    <label class="form-label" for="username">Identifiant</label>
                    <input class="form-control" type="text" id="username" name="username" autocomplete="username"
                           required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Mot de passe</label>
                    <input class="form-control" type="password" id="password" name="password"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Se connecter</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
