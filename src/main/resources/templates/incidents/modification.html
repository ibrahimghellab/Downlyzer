<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifier un incident — Downlyzer</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/entete :: entete}"></header>
<main>
    <p><a th:href="@{/incidents/{id}(id=${incident.id})}" th:text="'← Incident n° ' + ${incident.id}">← Incident n° 12</a></p>

    <h1>Modifier la description</h1>
    <p>
        <strong th:text="${incident.equipement.reference} + ' — ' + ${incident.equipement.libelle}">ASC-001 — Ascenseur quai A</strong>,
        station <span th:text="${incident.equipement.station.nom}">Gare Centrale</span>
    </p>

    <form method="post" th:action="@{/incidents/{id}/description(id=${incident.id})}" th:object="${modification}">
        <label for="description">Description de la panne</label>
        <textarea id="description" th:field="*{description}" rows="5" required minlength="10" maxlength="1000"></textarea>
        <p class="message-erreur" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
            La description doit contenir entre 10 et 1000 caractères.
        </p>

        <button type="submit">Enregistrer</button>
        <a th:href="@{/incidents/{id}(id=${incident.id})}">Annuler</a>
    </form>
</main>
</body>
</html>
