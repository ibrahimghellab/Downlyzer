<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' - Downlyzer'">Erreur - Downlyzer</title>
    <th:block th:replace="~{fragments/entete :: styles}"></th:block>
</head>
<body>
<header th:replace="~{fragments/entete :: entete('')}"></header>
<main class="container pb-4">
    <div class="card mx-auto carte-erreur">
        <div class="card-body p-4 text-center">
            <h1 class="h3" th:text="${titre}">Introuvable</h1>
            <p class="text-body-secondary" th:text="${message}">L'incident n° 999 n'existe pas.</p>
            <a class="btn btn-primary" th:href="@{/stations}">Retour aux stations</a>
        </div>
    </div>
</main>
</body>
</html>
